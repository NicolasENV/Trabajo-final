<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Anime World</title>
    <link rel="stylesheet" href="css/inicio.sesion.css">
    <script src="js/inicio-sesion.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="contenedor contenido-header">
            <a href="#inicio" class="logo">Anime World</a>
            <nav aria-label="Navegación principal">
                <ul class="nav-lista">
                    <li><a href="#inicio" class="btn-home">Home</a></li>
                    <li><a href="#mangas" class="btn-mangas">Mangas</a></li>
                    <li><a href="#figuras" class="btn-figuras">Figuras</a></li>
                    <li>
                        <a href="#inicio-sesion" class="btn-sesion activo">
                            <img src="img-inicio-sesion/profile_user.png" alt="Icono de usuario" id="img-inicio-sesion">
                            <span>Inicio de Sesión</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="form-sesion" aria-labelledby="titulo-login">
            <form id="form-login" novalidate>
                <h1 id="titulo-login">INICIO DE SESIÓN</h1>
                <p class="subtitulo-form">Por favor, introduzca su correo electrónico y contraseña</p>

                <div class="campo">
                    <label for="email">Ingrese su correo</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>

                <div class="campo">
                    <label for="password">Ingrese su contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <input type="submit" value="Iniciar sesión" class="btn-submit">
                <p id="mensaje-estado" class="mensaje-estado" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="contenedor">
            <p></p>
        </div>
    </footer>
</body>
</html>
